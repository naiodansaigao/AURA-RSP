<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1100" viewBox="0 0 2300 1100">
<defs><marker id="arrow" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto"><path d="M0,0 L14,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="1150" y="80" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="45" font-weight="700">AURA-RSP: Exact Replay vs. True Double Spend</text>
<rect x="80" y="390" width="360" height="150" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="260.0" y="445.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">First valid transcript</text>
<text x="260.0" y="485.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">(nu, gamma, c, proof)</text>
<rect x="610" y="390" width="360" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="790.0" y="445.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">Store UsedNullifier</text>
<text x="790.0" y="485.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">execute business once</text>
<rect x="1160" y="180" width="400" height="170" rx="18" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/>
<text x="1360.0" y="225.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">Same auth_hash</text>
<text x="1360.0" y="265.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">return cached result</text>
<text x="1360.0" y="305.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">no tracing</text>
<rect x="1160" y="620" width="430" height="170" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="1375.0" y="685.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">Same nu, distinct valid transcript</text>
<text x="1375.0" y="725.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">recover k</text>
<rect x="1720" y="620" width="500" height="170" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="1970.0" y="685.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">k=(c-c')/(gamma-gamma') mod q</text>
<text x="1970.0" y="725.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">EUM lookup L_tr[k]</text>
<rect x="1720" y="860" width="500" height="150" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="1970.0" y="915.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">Reject second execution</text>
<text x="1970.0" y="955.0" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="600">recover offending EID</text>
<line x1="440" y1="465" x2="602" y2="465" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="970" y1="435" x2="1152" y2="265" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="970" y1="505" x2="1152" y2="705" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1590" y1="705" x2="1712" y2="705" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1970" y1="790" x2="1970" y2="852" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1060" y="300" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" fill="#374151">byte-identical</text>
<text x="1050" y="620" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" fill="#374151">different context, valid proof</text>
</svg>
