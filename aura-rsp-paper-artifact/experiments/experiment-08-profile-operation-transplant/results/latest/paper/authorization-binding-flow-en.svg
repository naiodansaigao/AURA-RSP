<rect width="1500" height="425" fill="#ffffff"/>
<text x="38" y="66" class="title">Minimal Authorization Binding Chain</text>
<rect x="38" y="142" width="245" height="150" rx="18" class="node"/><text x="160" y="200" text-anchor="middle" class="head">Operation ticket</text><text x="160" y="246" text-anchor="middle" class="sub">pid_h + op</text><line x1="283" y1="217" x2="330" y2="217" class="arrow"/><polygon points="330,217 314,207 314,227" class="tip"/><rect x="330" y="142" width="245" height="150" rx="18" class="node"/><text x="452" y="200" text-anchor="middle" class="head">Anonymous proof</text><text x="452" y="246" text-anchor="middle" class="sub">Pi_auth binds full context</text><line x1="575" y1="217" x2="622" y2="217" class="arrow"/><polygon points="622,217 606,207 606,227" class="tip"/><rect x="622" y="142" width="245" height="150" rx="18" class="node"/><text x="744" y="200" text-anchor="middle" class="head">Authentication binding</text><text x="744" y="246" text-anchor="middle" class="sub">Bind_t binds transcript</text><line x1="867" y1="217" x2="914" y2="217" class="arrow"/><polygon points="914,217 898,207 898,227" class="tip"/><rect x="914" y="142" width="245" height="150" rx="18" class="node"/><text x="1036" y="200" text-anchor="middle" class="head">Key request</text><text x="1036" y="246" text-anchor="middle" class="sub">Session and one-time key</text><line x1="1159" y1="217" x2="1206" y2="217" class="arrow"/><polygon points="1206,217 1190,207 1190,227" class="tip"/><rect x="1206" y="142" width="245" height="150" rx="18" class="node"/><text x="1328" y="200" text-anchor="middle" class="head">Profile delivery</text><text x="1328" y="246" text-anchor="middle" class="sub">Only authorized Profile</text>
</svg>