<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430">
<style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Arial",sans-serif;fill:#172033}
.title{font-size:40px;font-weight:700} .head{font-size:22px;font-weight:700}
.sub{font-size:18px;fill:#536176} .node{fill:#f8fafc;stroke:#5b72e8;stroke-width:3}
.arrow{stroke:#667085;stroke-width:4} .arrowhead{fill:#667085}
</style>
<rect width="1500" height="430" fill="#ffffff"/>
<text x="40" y="68" class="title">Cross-Server Transplant Rejection Chain</text>
<rect x="40" y="145" width="240" height="150" rx="18" class="node"/><text x="160" y="202" text-anchor="middle" class="head">Capture A authentication</text><text x="160" y="247" text-anchor="middle" class="sub">No public EID</text><line x1="280" y1="220" x2="330" y2="220" class="arrow"/><polygon points="330,220 314,210 314,230" class="arrowhead"/><rect x="330" y="145" width="240" height="150" rx="18" class="node"/><text x="450" y="202" text-anchor="middle" class="head">Forward or mutate for B</text><text x="450" y="247" text-anchor="middle" class="sub">Server/session fields change</text><line x1="570" y1="220" x2="620" y2="220" class="arrow"/><polygon points="620,220 604,210 604,230" class="arrowhead"/><rect x="620" y="145" width="240" height="150" rx="18" class="node"/><text x="740" y="202" text-anchor="middle" class="head">B checks local session</text><text x="740" y="247" text-anchor="middle" class="sub">Transaction or context mismatch</text><line x1="860" y1="220" x2="910" y2="220" class="arrow"/><polygon points="910,220 894,210 894,230" class="arrowhead"/><rect x="910" y="145" width="240" height="150" rx="18" class="node"/><text x="1030" y="202" text-anchor="middle" class="head">Verify ticket, tau, Pi_auth</text><text x="1030" y="247" text-anchor="middle" class="sub">Old proof cannot cover new context</text><line x1="1150" y1="220" x2="1200" y2="220" class="arrow"/><polygon points="1200,220 1184,210 1184,230" class="arrowhead"/><rect x="1200" y="145" width="240" height="150" rx="18" class="node"/><text x="1320" y="202" text-anchor="middle" class="head">Reject</text><text x="1320" y="247" text-anchor="middle" class="sub">No Bind_t / no profile delivery</text>
</svg>